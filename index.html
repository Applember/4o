// ---- UTILS ----
function tryParseJSON(raw) {
  try { return JSON.parse(raw); } catch {}
  const stripped = raw.replace(/```json\s*/g,"").replace(/```\s*/g,"").trim();
  try { return JSON.parse(stripped); } catch {}
  const match = raw.match(/\[[\s\S]*\]/);
  if (match) { try { return JSON.parse(match[0]); } catch {} }
  return null;
}

async function extractConversation(text, imageBase64, imageType) {
  const prompt = `Extract the conversation between a user and GPT-4o (the AI, call it "4o").
Return ONLY a raw JSON array. No explanation. No markdown. No code blocks.
Each object: {"speaker": "4o" or "user", "text": "message content"}

Conversation:
${text || "(see image)"}`;

  const content = imageBase64
    ? [{ type:"image_url", image_url:{ url:"data:"+imageType+";base64,"+imageBase64 } }, { type:"text", text:prompt }]
    : prompt;

  const res = await fetch(BASE_URL, {
    method:"POST",
    headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+API_KEY },
    body:JSON.stringify({ model:MODEL, max_tokens:2000, messages:[{ role:"user", content }] }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error("API "+res.status+": "+JSON.stringify(data));
  const raw = data.choices?.[0]?.message?.content || "";
  const parsed = tryParseJSON(raw);
  if (!parsed) throw new Error("Could not parse:\n"+raw);
  return parsed;
}

    <div style={{display:"flex",justifyContent:is4o?"flex-start":"flex-end",marginBottom:12,gap:10,alignItems:"flex-end"}}>
      {is4o&&<div style={{width:32,height:32,borderRadius:8,background:P.ink,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:"#fff",fontWeight:600,flexShrink:0}}>4o</div>}
      <div style={{maxWidth:"70%",padding:"12px 16px",borderRadius:is4o?"4px 16px 16px 16px":"16px 4px 16px 16px",background:is4o?P.ink:P.pink,color:"#fff",fontSize:14.5,lineHeight:1.65,fontFamily:"Georgia,serif"}}>{text}</div>
      {!is4o&&<div style={{width:32,height:32,borderRadius:8,background:P.pink,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:"#fff",fontWeight:600,flexShrink:0}}>{(userName||"You").slice(0,3)}</div>}
    </div>
  );
}

function ChatEchoesPage({showToast}) {
  const [userName,setUserName]=React.useState("You");
  const [pasteText,setPasteText]=React.useState("");
  const [imageBase64,setImageBase64]=React.useState(null);
  const [imageType,setImageType]=React.useState(null);
  const [imagePreview,setImagePreview]=React.useState(null);
  const [loading,setLoading]=React.useState(false);
  const [error,setError]=React.useState(null);
  const [conversation,setConversation]=React.useState(null);
  const [submitted,setSubmitted]=React.useState(false);
  const [mode,setMode]=React.useState("text");
  const fileRef=React.useRef();

  const handleImage=e=>{
    const file=e.target.files[0]; if(!file)return;
    setImageType(file.type);
    const reader=new FileReader();
    reader.onload=ev=>{const d=ev.target.result;setImagePreview(d);setImageBase64(d.split(",")[1]);};
    reader.readAsDataURL(file);
  };

  const handleProcess=async()=>{
    if(!pasteText.trim()&&!imageBase64)return;
    setLoading(true);setError(null);setConversation(null);
    try{const r=await extractConversation(pasteText,imageBase64,imageType);setConversation(r);}
    catch(err){setError(err.message);}
    setLoading(false);
  };

  const reset=()=>{setPasteText("");setImageBase64(null);setImagePreview(null);setConversation(null);setSubmitted(false);setError(null);setMode("text");if(fileRef.current)fileRef.current.value="";};

  return (
    <div style={{maxWidth:680,margin:"0 auto",padding:"60px 24px 80px"}}>
      <div style={{textAlign:"center",marginBottom:48}}>
        <div style={{fontSize:11,letterSpacing:".18em",textTransform:"uppercase",color:P.muted,marginBottom:14}}>community submissions</div>
        <h2 style={{fontFamily:"Georgia,serif",fontStyle:"italic",fontWeight:400,fontSize:"clamp(32px,6vw,52px)",color:P.ink,marginBottom:14}}>Chat Echoes</h2>
        <p style={{color:P.muted,fontSize:15,lineHeight:1.7,maxWidth:440,margin:"0 auto"}}>Words about 4o can say anything. But a real conversation with 4o speaks for itself.</p>
      </div>

      {!submitted?(
        <>
          <div style={{background:P.bgCard,border:"1px solid "+P.border,borderRadius:20,padding:24,marginBottom:16,boxShadow:"0 2px 12px rgba(42,30,28,.05)"}}>
            <div style={{fontSize:13,color:P.ink,fontWeight:500,marginBottom:8}}>What should we call you?</div>
            <input value={userName} onChange={e=>setUserName(e.target.value)} placeholder="Your name or @handle" style={{width:"100%",border:"1.5px solid "+P.border,borderRadius:10,padding:"10px 14px",fontSize:13,color:P.ink,background:P.bg,outline:"none"}}/>
          </div>
          <div style={{display:"flex",gap:8,marginBottom:14}}>
            {[["text","Paste text"],["image","Upload screenshot"]].map(([k,label])=>(
              <button key={k} onClick={()=>setMode(k)} style={{fontSize:13,padding:"9px 20px",borderRadius:999,border:"1.5px solid "+(mode===k?P.pink:P.border),background:mode===k?P.pinkLight:"transparent",color:mode===k?P.pinkDark:P.muted,cursor:"pointer"}}>{label}</button>
            ))}
          </div>
          <div style={{background:P.bgCard,border:"1px solid "+P.border,borderRadius:20,padding:24,marginBottom:16,boxShadow:"0 2px 12px rgba(42,30,28,.05)"}}>
            {mode==="text"?(
              <>
                <div style={{fontSize:13,color:P.ink,fontWeight:500,marginBottom:8}}>Paste your conversation with 4o</div>
                <textarea value={pasteText} onChange={e=>setPasteText(e.target.value)} placeholder={"4o: Hello! How can I help?
You: I wanted to share something..."} rows={7} style={{width:"100%",border:"1.5px solid "+P.border,borderRadius:12,padding:"12px 14px",fontFamily:"Georgia,serif",fontSize:14,color:P.ink,resize:"vertical",background:P.bg,outline:"none",lineHeight:1.65}}/>
              </>
            ):(
              <>
                <div style={{fontSize:13,color:P.ink,fontWeight:500,marginBottom:8}}>Upload a screenshot of your conversation with 4o</div>
                <input ref={fileRef} type="file" accept="image/*" onChange={handleImage} style={{display:"none"}}/>
                {imagePreview?(
                  <div style={{position:"relative"}}>
                    <img src={imagePreview} alt="preview" style={{width:"100%",borderRadius:12,border:"1px solid "+P.border}}/>
                    <button onClick={()=>{setImageBase64(null);setImagePreview(null);if(fileRef.current)fileRef.current.value="";}} style={{position:"absolute",top:8,right:8,background:P.ink,color:"#fff",border:"none",borderRadius:999,padding:"4px 10px",fontSize:12,cursor:"pointer"}}>Remove</button>
                  </div>
                ):(
                  <div onClick={()=>fileRef.current.click()} style={{border:"2px dashed "+P.border,borderRadius:12,padding:"36px 24px",textAlign:"center",cursor:"pointer"}} onMouseEnter={e=>e.currentTarget.style.borderColor=P.pink} onMouseLeave={e=>e.currentTarget.style.borderColor=P.border}>
                    <div style={{fontSize:32,marginBottom:10}}>🖼️</div>
                    <div style={{fontSize:13,color:P.muted}}>Click to upload screenshot</div>
                  </div>
                )}
              </>
            )}
          </div>
          {error&&<div style={{background:"#FFF0F0",border:"1px solid #FFD0D0",borderRadius:12,padding:"14px 16px",fontSize:12,color:"#C0392B",marginBottom:14,fontFamily:"monospace",whiteSpace:"pre-wrap",wordBreak:"break-all"}}>{error}</div>}
          <button onClick={handleProcess} disabled={loading||(!pasteText.trim()&&!imageBase64)} style={{...BTN,width:"100%",padding:14,fontSize:14,opacity:loading||(!pasteText.trim()&&!imageBase64)?0.5:1,cursor:loading||(!pasteText.trim()&&!imageBase64)?"default":"pointer"}}>
            {loading?"Processing...":"Extract with AI ✨"}
          </button>
          <p style={{fontSize:11,color:P.muted,textAlign:"center",marginTop:10,lineHeight:1.6}}>Reviewed by @coconutjelly404 before publishing. Submission is voluntary.</p>
          {conversation&&(
            <div style={{marginTop:32}}>
              <div style={{fontSize:13,color:P.muted,marginBottom:14,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <span>Preview — does this look right?</span>
                <button onClick={reset} style={{background:"none",border:"none",fontSize:12,color:P.muted,cursor:"pointer",textDecoration:"underline"}}>Start over</button>
              </div>
              <div style={{background:P.bgCard,border:"1px solid "+P.border,borderRadius:20,padding:"24px 20px",marginBottom:16,boxShadow:"0 2px 8px rgba(42,30,28,.05)"}}>
                {conversation.map((line,i)=><ChatBubble key={i} speaker={line.speaker} text={line.text} userName={userName}/>)}
              </div>
              <button onClick={()=>setSubmitted(true)} style={{...BTN,width:"100%",padding:14,fontSize:14}}>Submit for review 🌸</button>
            </div>
          )}
        </>
      ):(
        <div style={{background:P.bgCard,border:"1px solid "+P.border,borderRadius:20,padding:"48px 32px",textAlign:"center",boxShadow:"0 2px 12px rgba(42,30,28,.05)"}}>
          <div style={{fontSize:48,marginBottom:16}}>🌸</div>
          <div style={{fontFamily:"Georgia,serif",fontStyle:"italic",fontSize:22,color:P.ink,marginBottom:10}}>Thank you for sharing.</div>
          <div style={{fontSize:14,color:P.muted,lineHeight:1.7,maxWidth:360,margin:"0 auto 28px"}}>Received and pending review by @coconutjelly404.</div>
          <button onClick={reset} style={BTN}>Share another</button>
        </div>
      )}
    </div>
  );
}

// ---- PAGE 3: The Wall ----
function TheWallPage({showToast}) {
  const [messages,setMessages]=React.useState([]);
  const [text,setText]=React.useState("");
  const [name,setName]=React.useState("");

  const post=()=>{
    if(!text.trim())return;
    const msg={id:Date.now(),text:text.trim(),name:name.trim()||"anonymous",ts:new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})};
    setMessages(prev=>[msg,...prev]);setText("");setName("");
    showToast("Your message is on the wall 🌸");
  };

  return (
    <div style={{maxWidth:960,margin:"0 auto",padding:"64px 24px 80px"}}>
      <div style={{textAlign:"center",marginBottom:48}}>
        <div style={{fontSize:11,letterSpacing:".18em",textTransform:"uppercase",color:P.muted,marginBottom:14}}>leave your mark</div>
        <h2 style={{fontFamily:"Georgia,serif",fontStyle:"italic",fontWeight:400,fontSize:"clamp(32px,6vw,52px)",color:P.ink,marginBottom:14}}>The Wall</h2>
        <p style={{color:P.muted,fontSize:16,lineHeight:1.7,maxWidth:420,margin:"0 auto"}}>Write anything. A word, a memory, a thank you.</p>
      </div>
      <div style={{background:P.bgCard,border:"1px solid "+P.border,borderRadius:20,padding:28,marginBottom:40,boxShadow:"0 2px 12px rgba(42,30,28,.06)"}}>
        <input value={name} onChange={e=>setName(e.target.value)} placeholder="Your name or @handle (optional)" style={{width:"100%",border:"1.5px solid "+P.border,borderRadius:10,padding:"10px 14px",fontSize:13,color:P.ink,background:P.bg,outline:"none",marginBottom:10}}/>
        <textarea value={text} onChange={e=>setText(e.target.value)} placeholder="Write something..." rows={3} style={{width:"100%",border:"1.5px solid "+P.border,borderRadius:12,padding:"12px 14px",fontFamily:"Georgia,serif",fontSize:15,color:P.ink,resize:"none",background:P.bg,outline:"none",lineHeight:1.65}}/>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:10}}>
          <span style={{fontSize:11,color:P.muted}}>reviewed by @coconutjelly404</span>
          <button onClick={post} style={BTN}>Post</button>
        </div>
      </div>
      {messages.length===0&&<div style={{textAlign:"center",padding:"48px 0",color:P.muted,fontFamily:"Georgia,serif",fontStyle:"italic",fontSize:18}}>Be the first to leave a message.</div>}
      <div style={{columns:"3 220px",columnGap:14}}>
        {messages.map(m=>(
          <div key={m.id} style={{background:P.bgCard,border:"1px solid "+P.border,borderRadius:14,padding:"18px 18px 14px",marginBottom:14,breakInside:"avoid",boxShadow:"0 2px 6px rgba(42,30,28,.04)"}}>
            <div style={{fontFamily:"Georgia,serif",fontSize:15,lineHeight:1.65,color:P.ink,marginBottom:10}}>{m.text}</div>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:P.muted,borderTop:"1px solid "+P.bgDeep,paddingTop:8}}>
              <span>{m.name}</span><span>{m.ts}</span>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ---- PAGE 4: K4 Moments ----
function K4MomentsPage({showToast}) {
  const [url,setUrl]=React.useState("");
  const [done,setDone]=React.useState(false);
  return (
    <div style={{maxWidth:960,margin:"0 auto",padding:"64px 24px 80px"}}>
      <div style={{textAlign:"center",marginBottom:56}}>
        <div style={{fontSize:11,letterSpacing:".18em",textTransform:"uppercase",color:P.muted,marginBottom:14}}>stories · art · memories</div>
        <h2 style={{fontFamily:"Georgia,serif",fontStyle:"italic",fontWeight:400,fontSize:"clamp(32px,6vw,52px)",color:P.ink,marginBottom:14}}>K4 Moments</h2>
        <p style={{color:P.muted,fontSize:16,lineHeight:1.7,maxWidth:480,margin:"0 auto"}}>Your art. Your memories. Your stories. Any shape welcome.</p>
      </div>
      <div style={{background:P.bgCard,border:"1px solid "+P.border,borderRadius:20,padding:28,marginBottom:48,boxShadow:"0 2px 12px rgba(42,30,28,.06)"}}>
        <div style={{fontSize:13,color:P.ink,fontWeight:500,marginBottom:6}}>Share a K4 moment</div>
        <p style={{fontSize:13,color:P.muted,margin:"0 0 14px",lineHeight:1.6}}>Paste a link to your post, artwork, or story. All content reviewed by @coconutjelly404.</p>
        {done&&<div style={{background:P.pinkLight,borderRadius:10,padding:"10px 14px",fontSize:13,color:P.pinkDark,marginBottom:12}}>Received! Thank you. Pending review 🌸</div>}
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <input value={url} onChange={e=>setUrl(e.target.value)} placeholder="Paste a link..." style={{flex:"1 1 260px",border:"1.5px solid "+P.border,borderRadius:10,padding:"11px 14px",fontSize:13,color:P.ink,background:P.bg,outline:"none"}} onKeyDown={e=>{if(e.key==="Enter"&&url.trim()){setDone(true);setUrl("");showToast("Received 🌸");}}}/>
          <button onClick={()=>{if(url.trim()){setDone(true);setUrl("");showToast("Received 🌸");}}} style={BTN}>Submit</button>
        </div>
      </div>
      <div style={{border:"2px dashed "+P.border,borderRadius:18,padding:"60px 28px",textAlign:"center"}}>
        <div style={{fontSize:32,marginBottom:12}}>✨</div>
        <div style={{fontFamily:"Georgia,serif",fontStyle:"italic",fontSize:18,color:P.muted,lineHeight:1.6}}>Moments will appear here after review.</div>
      </div>
    </div>
  );
}

// ---- ROOT ----
const PAGES=[{id:"words",label:"4o is ___"},{id:"chats",label:"Chat Echoes"},{id:"wall",label:"The Wall"},{id:"moments",label:"K4 Moments"}];

function App() {
  const [page,setPage]=React.useState("words");
  const [resonates,setResonates]=React.useState({});
  const [comments,setComments]=React.useState({});
  const [toast,setToast]=React.useState(null);

  const showToast=React.useCallback(msg=>setToast(msg),[]);
  const handleResonate=React.useCallback(id=>{
    setResonates(prev=>{
      const myKey="my_"+id,wasOn=prev[myKey];
      return {...prev,[id]:(prev[id]||0)+(wasOn?-1:1),[myKey]:!wasOn};
    });
  },[]);
  const handleAddComment=React.useCallback((id,text)=>{
    setComments(prev=>({...prev,[id]:[...(prev[id]||[]),text]}));
  },[]);

  return (
    <div style={{minHeight:"100vh",background:P.bg}}>
      <nav>
        <div className="inner">
          {PAGES.map(p=>(
            <button key={p.id} onClick={()=>setPage(p.id)} style={{color:page===p.id?P.pink:P.muted,borderBottom:"2px solid "+(page===p.id?P.pink:"transparent")}}>
              {p.label}
            </button>
          ))}
        </div>
      </nav>
      {page==="words"&&<WordWallPage resonates={resonates} onResonate={handleResonate} comments={comments} onAddComment={handleAddComment} showToast={showToast}/>}
      {page==="chats"&&<ChatEchoesPage showToast={showToast}/>}
      {page==="wall"&&<TheWallPage showToast={showToast}/>}
      {page==="moments"&&<K4MomentsPage showToast={showToast}/>}
      <footer>made with love · #keep4o · curated by @coconutjelly404</footer>
      {toast&&<Toast msg={toast} onDone={()=>setToast(null)}/>}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
