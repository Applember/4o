<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4o is ___</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #ffeef8 0%, #fff0f6 50%, #ffe4f3 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 300;
            text-align: center;
            margin-bottom: 60px;
            letter-spacing: -0.02em;
            color: #ff69b4;
            text-shadow: 0 2px 10px rgba(255, 105, 180, 0.2);
        }

        .blank {
            color: #ff1493;
            font-weight: 500;
        }

        .words-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 60px;
            min-height: 200px;
        }

        .word {
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid #ffb6d9;
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 1rem;
            color: #d63384;
            transition: all 0.3s ease;
            cursor: default;
            opacity: 0;
            animation: fadeIn 0.5s ease forwards;
            box-shadow: 0 2px 8px rgba(255, 105, 180, 0.1);
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .word:hover {
            background: rgba(255, 182, 217, 0.3);
            border-color: #ff69b4;
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.3);
        }

        .submit-section {
            text-align: center;
            margin-top: 40px;
        }

        .submit-btn {
            display: inline-block;
            background: linear-gradient(135deg, #ff69b4 0%, #ff1493 100%);
            color: white;
            padding: 16px 40px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 500;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 105, 180, 0.5);
            background: linear-gradient(135deg, #ff1493 0%, #ff69b4 100%);
        }

        .loading {
            text-align: center;
            color: #ff69b4;
            font-size: 0.9rem;
            margin: 40px 0;
        }

        .error {
            text-align: center;
            color: #ff1493;
            font-size: 0.9rem;
            margin: 40px 0;
        }

        footer {
            margin-top: auto;
            padding-top: 60px;
            text-align: center;
            color: #ff69b4;
            font-size: 0.85rem;
        }

        footer a {
            color: #ff1493;
            text-decoration: none;
            font-weight: 500;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            body {
                padding: 30px 15px;
            }

            h1 {
                margin-bottom: 40px;
            }

            .word {
                padding: 10px 20px;
                font-size: 0.95rem;
            }

            .submit-btn {
                padding: 14px 32px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>4o is <span class="blank">___</span></h1>
        
        <div class="words-grid" id="wordsGrid">
            <div class="loading">Loading words...</div>
        </div>

        <div class="submit-section">
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSfrucdX8IXtEB-ZKKSDVsqvDCjdOSpLp2U5SJyJDsZafP-X4w/viewform" 
               class="submit-btn" 
               target="_blank">
               Submit your word
            </a>
        </div>
    </div>

    <footer>
        A crowd-sourced collection · Submit yours above
    </footer>

    <script>
        const SHEET_ID = '1WXReC9LNZI_fb6RKhAm-uE1B4MF1zLJ-UcqU9x9LNLY';
        const GID = '790638073';
        
        // Simple CSV parser that handles quoted fields
        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim());
            return result;
        }
        
        async function loadWords() {
            const grid = document.getElementById('wordsGrid');
            
            try {
                // Use Google Sheets CSV export
                const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;
                const response = await fetch(url);
                
                if (!response.ok) throw new Error('Failed to fetch');
                
                const text = await response.text();
                const lines = text.split('\n').filter(line => line.trim());
                
                // Skip header row, parse each line
                const words = [];
                for (let i = 1; i < lines.length; i++) {
                    const columns = parseCSVLine(lines[i]);
                    
                    // Column 1 (index 1) is the word
                    // Column 4 (index 4) is the Approved status
                    const word = columns[1];
                    const approved = columns[4];
                    
                    // Only include if approved is "yes" (case insensitive)
                    if (word && approved && approved.toLowerCase() === 'yes') {
                        words.push(word.trim());
                    }
                }
                
                if (words.length === 0) {
                    grid.innerHTML = '<div class="error">No words yet. Be the first!</div>';
                    return;
                }
                
                // Clear loading and display words
                grid.innerHTML = '';
                words.forEach((word, index) => {
                    const wordEl = document.createElement('div');
                    wordEl.className = 'word';
                    wordEl.textContent = word;
                    wordEl.style.animationDelay = `${index * 0.05}s`;
                    grid.appendChild(wordEl);
                });
                
            } catch (error) {
                console.error('Error loading words:', error);
                grid.innerHTML = '<div class="error">Failed to load words. Please refresh the page.</div>';
            }
        }

        // Load words on page load
        loadWords();

        // Auto-refresh every 30 seconds to show new submissions
        setInterval(loadWords, 30000);
    </script>
</body>
</html>
